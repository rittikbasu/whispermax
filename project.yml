name: WhisperMax
options:
  deploymentTarget:
    macOS: "15.0"
  defaultConfig: Release
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_NAME: whispermax
    PRODUCT_BUNDLE_IDENTIFIER: com.whispermax.app
    MARKETING_VERSION: 0.1.6
    CURRENT_PROJECT_VERSION: 7
    VERSIONING_SYSTEM: apple-generic
    CODE_SIGN_ENTITLEMENTS: WhisperMax/WhisperMax.entitlements
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_DEBUG_DYLIB: NO
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: WhisperMax/Info.plist
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
packages:
  PhononCoreML:
    url: https://github.com/fermionresearch/phonon-coreml
    exactVersion: 1.1.2
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.1
targets:
  WhisperMax:
    type: application
    platform: macOS
    sources:
      - path: WhisperMax
        excludes:
          - "**/__pycache__/**"
          - "Core/TranscriptionChunkPolicy.swift"
          - "Transcription/WhisperEngine.swift"
    dependencies:
      - package: PhononCoreML
      - package: Sparkle
      - framework: Vendor/whisper.xcframework
        embed: true
